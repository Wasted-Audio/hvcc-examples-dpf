name: build

on:
  push:
  repository_dispatch:
    types: [nightly]

env:
  HVCC_COMMIT_HASH: "${{ github.event.client_payload.nightly && github.event.client_payload.branch || '7b78f8d3f8483fbe3d93065819391ed882d3c372' }}"
  CACHE_VERSION: 3
  DEBIAN_FRONTEND: noninteractive
  GIT_LFS_SKIP_SMUDGE: 1

jobs:
  linux:
    strategy:
      matrix:
        target: [linux-arm64, linux-armhf, linux-i686, linux-riscv64, linux-x86_64]
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    steps:
      - uses: actions/cache@v4
        name: Cache python3.10
        with:
          path: /opt/python3.10
          key: cpython-3.10.14-standalone-20240415-x86_64
      - name: Install git
        run: |
          apt-get update -qq && apt-get install -yqq --no-install-recommends ca-certificates curl git openssl
          curl -sLO https://launchpad.net/~kxstudio-debian/+archive/ubuntu/toolchain/+files/git_2.34.1-1ubuntu1~bpo20.04.1~ppa1_amd64.deb
          curl -sLO https://launchpad.net/~kxstudio-debian/+archive/ubuntu/toolchain/+files/git-man_2.34.1-1ubuntu1~bpo20.04.1~ppa1_all.deb
          dpkg -i *.deb
          rm *.deb
      - name: Install python3.10
        run: |
          if [ ! -x /opt/python3.10/bin/python3.10 ]; then
            cd /tmp
            curl -sSLO https://github.com/astral-sh/python-build-standalone/releases/download/20240415/cpython-3.10.14+20240415-x86_64-unknown-linux-gnu-install_only.tar.gz
            tar xf cpython-3.10.14+20240415-x86_64-unknown-linux-gnu-install_only.tar.gz
            mv python /opt/python3.10
          fi
          ln -sf /opt/python3.10/bin/python3.10 /usr/bin/python3.10
          ln -sf /opt/python3.10/bin/python3.10 /usr/bin/python3
          curl -sS https://bootstrap.pypa.io/get-pip.py | /usr/bin/python3
          echo "PATH=/opt/python3.10/bin:$PATH" >> "$GITHUB_ENV"
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: distrho/dpf-makefile-action@v1
        with:
          target: ${{ matrix.target }}
          hvcc: True

  windows:
    strategy:
      matrix:
        target: [win32, win64]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: distrho/dpf-makefile-action@v1
        with:
          target: ${{ matrix.target }}
          hvcc: True

  macos:
    strategy:
      matrix:
        target: [macos-intel, macos-universal]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: innodatalabs/action-pip-conf@1.0.0
        with:
            pip-conf: "[global]\nbreak-system-packages = true"

      - uses: distrho/dpf-makefile-action@v1
        env:
          MACOS_PKG_NAME: "hvcc-examples-dpf"
          MACOS_PKG_LICENSE_FILE: "${{ github.workspace }}/LICENSE"
          MACOS_PKG_WELCOME_TXT: "${{ github.workspace }}/welcome.txt"
          MACOS_APP_CERTIFICATE: ${{ secrets.MACOS_APP_CERTIFICATE }}
          MACOS_INSTALLER_CERTIFICATE: ${{ secrets.MACOS_INSTALLER_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_NOTARIZATION_USER: ${{ secrets.MACOS_NOTARIZATION_USER }}
          MACOS_NOTARIZATION_PASS: ${{ secrets.MACOS_NOTARIZATION_PASS }}
          MACOS_NOTARIZATION_TEAM: ${{ secrets.MACOS_NOTARIZATION_TEAM }}
        with:
          target: ${{ matrix.target }}
          hvcc: True

  pluginval:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: distrho/dpf-makefile-action@v1
        with:
          target: pluginval
          hvcc: True

  source:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: distrho/dpf-makefile-action@v1
        with:
          target: source
